name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch-free on purpose: the tested code (deepetpicker/, utils/coord_gen,
      # normalization, coords2labels) must not need a GPU stack
      - run: pip install numpy pandas mrcfile starfile matplotlib pytest
      - run: python -m pytest tests -q
